<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI LIFE – Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0D1117;--panel:#161B22;--line:#30363D;--line2:#21262D;--text:#E6EDF3;--muted:#9DA7B3;--dim:#6E7681;--accent:#3FB9A8;--sel:#1C2330}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}
a{color:var(--accent)}a:hover{color:#6FD6C7}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.nav{display:flex;gap:4px}
.nav button{background:transparent;border:0;padding:8px 14px;border-radius:6px;color:var(--muted);font-weight:500;min-height:40px}
.nav button.on{background:#21262D;color:var(--text)}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.chip.off{border-style:dashed;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:6px;min-height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center}
main{max-width:1440px;margin:0 auto;padding:24px 28px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.left{flex:1 1 340px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.right{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
h2{margin:0;font-size:16px;font-weight:600}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.row{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:13px 15px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.row.on{background:var(--sel);border-color:var(--accent)}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:6px;background:var(--accent);color:#0D1117;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.ok{background:#3FB950}
.btn.no{background:transparent;border:1px solid #F85149;color:#FF7B72}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:700px){.grid2,.grid4{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font:14px Inter,sans-serif;padding:10px 12px;min-height:44px}
.in:focus{outline:2px solid var(--accent);outline-offset:1px}
.kv{display:flex;flex-direction:column;gap:4px}.kv span:first-child{color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
.step{display:flex;align-items:center;gap:8px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none}
.sline{width:36px;height:2px;margin:0 10px}
.log{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px 20px;font-size:13px;line-height:1.7;display:flex;flex-direction:column;gap:8px}
.log .k{color:var(--muted);display:inline-block;min-width:96px}
.plan{border:1px solid rgba(240,136,62,.5);background:rgba(240,136,62,.06);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{padding:10px 12px;border-radius:6px;background:rgba(240,136,62,.12);color:#F0A86E;font-size:13px}
.ek{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px}
.ek button{background:transparent;border:0;color:var(--accent);padding:0;min-height:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 14px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr.pas{opacity:.5}
.tog{min-height:34px;min-width:70px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600}
.tog.a{background:rgba(63,185,80,.14);border:1px solid rgba(63,185,80,.4);color:#56D364}
.tog.p{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tabs{flex:1 1 230px;max-width:100%;display:flex;flex-direction:column;gap:4px}
.tabs button{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border-radius:6px;background:transparent;border:1px solid transparent;color:#C9D1D9;text-align:left;font-weight:500}
.tabs button.on{background:var(--sel);border-color:var(--accent);color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(1,4,9,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .card{width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;gap:14px}
.modal pre{margin:0;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:12px;line-height:1.5;flex:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{padding:10px 16px;border-radius:8px;background:#21262D;border:1px solid var(--line);font-size:13px;max-width:90vw}
.toast.err{border-color:#F85149;color:#FF7B72}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:8px}
code{font-family:"JetBrains Mono",monospace;font-size:12.5px;background:#21262D;padding:1px 5px;border-radius:4px}
.spin{width:8px;height:8px;border-radius:50%;background:#3FB950}
.spin.busy{background:#E3B341;animation:p 1s infinite}
.spin.err{background:#F85149}
@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
    <div class="brand"><span class="dot"></span><b style="letter-spacing:.04em">AI LIFE</b><span class="muted">Panel</span></div>
    <nav class="nav" aria-label="Ekranlar">
      <button data-a="view" data-v="emirler" id="nav-emirler" class="on">Emirler</button>
      <button data-a="view" data-v="tanimlar" id="nav-tanimlar">Tanımlar</button>
    </nav>
  </div>
  <div class="chips">
    <div id="chips" class="chips"></div>
    <div class="chip" id="runner" title="Runner durumu"><span class="dot" style="width:8px;height:8px;background:#6E7681"></span><span class="muted">Runner: —</span></div>
    <div class="sync"><span id="syncdot" class="spin"></span><span id="synctext">Bağlanmadı</span></div>
    <button class="iconbtn" data-a="refresh" aria-label="Şimdi yenile" title="Şimdi yenile"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="iconbtn" data-a="settings" aria-label="Bağlantı ayarları" title="Bağlantı ayarları"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg></button>
  </div>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>

<script>
const REPO = 'sapoguzhanaydemir-ux/ai-life-kopru';
const BRANCH = 'main';
const POLL_MS = 15000;
const TANIM_FILES = [
  ['emir-turleri','Emir türleri','Ajan davranışı “Onay gerekli” ve “Yazma izni” bayraklarından okunur.'],
  ['nesne-tipleri','Nesne tipleri','ADT karşılığı, ajanın nesneyi bulmak için kullandığı tiptir.'],
  ['durumlar','Durumlar','Sıra akıştaki yeri, “Bitiş” emrin kapandığını belirtir.'],
  ['oncelikler','Öncelikler','Ajan emirleri önce bu sıraya, sonra son tarihe göre işler.'],
  ['request-tercihleri','Request tercihleri','Sadece yazma izni olan emir türlerinde sorulur.'],
  ['musteriler','Müşteriler / Sistemler','Köprü yöntemi burada tanımlanır, emirde seçilmez.']
];
const RENK = {'Gri':'#9DA7B3','Mavi':'#58A6FF','Sarı':'#E3B341','Turuncu':'#F0883E','Yeşil':'#3FB950','Kırmızı':'#F85149'};

const S = {
  token: load('ailife_token') || '',
  view: 'emirler', sel: null, form: false, draft: {}, tab: 'emir-turleri', editRow: -1,
  head: null, tanim: {}, tanimRaw: {}, orders: [], results: {}, ekler: {},
  blobCache: {}, busy: false, last: null, err: null, runner: null, queued: 0
};

function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function save(k,v){ try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.getElementById('toast').appendChild(t); setTimeout(()=>t.remove(), err?7000:3500); }
function pathEnc(p){ return p.split('/').map(encodeURIComponent).join('/'); }

// ---------- GitHub API ----------
async function gh(path, opts){
  opts = opts || {};
  const r = await fetch('https://api.github.com/repos/' + REPO + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Authorization': 'Bearer ' + S.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store'
  });
  if (r.status === 404 && opts.allow404) return null;
  if ((r.status === 403 || r.status === 404) && opts.soft) return { __denied: true };
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message; } catch(e){}
    const e = new Error(r.status === 401 ? 'Token geçersiz ya da süresi dolmuş' : r.status === 403 ? 'Yetki yok: ' + m : r.status === 409 ? 'Çakışma: dosya bu sırada değişti, tekrar dene' : (r.status + ' ' + m));
    e.status = r.status; throw e;
  }
  return opts.raw ? r.text() : r.json();
}
async function blobText(path, sha){
  if (S.blobCache[sha] != null) return S.blobCache[sha];
  const t = await gh('/contents/' + pathEnc(path) + '?ref=' + S.head, { headers: { 'Accept': 'application/vnd.github.raw' }, raw: true });
  S.blobCache[sha] = t; return t;
}
async function listDir(path){ return (await gh('/contents/' + pathEnc(path) + '?ref=' + S.head, { allow404: true })) || []; }
async function putFile(path, content, message, sha){
  const body = { message: message, content: b64enc(content), branch: BRANCH };
  if (sha) body.sha = sha;
  return gh('/contents/' + pathEnc(path), { method: 'PUT', body: body });
}

// ---------- Markdown parse ----------
function rows(md){
  return md.split('\n').map(l => l.trim()).filter(l => l.startsWith('|'))
    .map(l => l.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim()))
    .filter(r => !r.every(c => /^:?-+:?$/.test(c)));
}
function parseTanim(md){
  const r = rows(md); if (!r.length) return { title: '', head: [], data: [] };
  const title = (md.split('\n').find(l => l.startsWith('# ')) || '# ').slice(2).trim();
  const head = r[0];
  return { title: title, head: head, data: r.slice(1).map(c => { const o = {}; head.forEach((h,i) => o[h] = c[i] == null ? '' : c[i]); return o; }) };
}
function tanimMd(t){
  const line = a => '| ' + a.map(x => String(x).replace(/\|/g,'/')).join(' | ') + ' |';
  return '# ' + t.title + '\n\n' + line(t.head) + '\n' + '|' + t.head.map(()=>'---').join('|') + '|\n' + t.data.map(o => line(t.head.map(h => o[h] || ''))).join('\n') + '\n';
}
function parseOrder(md){
  const o = { f: {} };
  rows(md).forEach(r => { if (r[0] && r[0] !== 'Alan') o.f[r[0]] = (r[1] || '').trim(); });
  const p = md.split(/^## Plan\s*$/m)[1] || '';
  o.plan = p.split('\n').map(l => l.trim()).filter(Boolean).map(l => l.replace(/^(\d+[.)]|[-*])\s*/, ''));
  o.id = (md.match(/^# (.+)$/m) || [,''])[1].trim();
  return o;
}
function parseResult(md){
  const r = { yapilan: [] }; let inY = false;
  md.split('\n').forEach(l => {
    const m = l.match(/^- \*\*(.+?):\*\*\s*(.*)$/);
    if (m) { const k = m[1]; inY = /^Yapılan/.test(k);
      if (/^İstenen/.test(k)) r.istenen = m[2]; else if (/^Sonuç/.test(k)) r.sonuc = m[2]; else if (/^Sonraki/.test(k)) r.sonraki = m[2]; else if (inY && m[2]) r.yapilan.push(m[2]);
      return; }
    const s = l.match(/^\s+[-*]\s+(.*)$/); if (s && inY && s[1].trim()) r.yapilan.push(s[1].trim());
  });
  if (r.sonraki && /^[—\-–\s]*$/.test(r.sonraki)) r.sonraki = '';
  return r;
}
function orderMd(id, f){
  const v = x => String(x == null || x === '' ? '—' : x).replace(/\|/g,'/').replace(/\n/g,' ');
  return '# ' + id + '\n\n## Alanlar\n| Alan | Değer |\n|---|---|\n' +
    ['Müşteri','Sistem / Client','Nesne tipi','Nesne adı','Emir türü','Talimat','Beklenen çıktı','Request tercihi','Öncelik','Son tarih'].map(k => '| ' + k + ' | ' + v(f[k]) + ' |').join('\n') +
    '\n\n## Durum\n| Alan | Değer |\n|---|---|\n| Durum | Verildi |\n| Onay | |\n| Alındı | |\n| Bitti | |\n\n## Plan\n';
}

// ---------- Tanım yardımcıları ----------
const T = n => (S.tanim[n] && S.tanim[n].data) || [];
const aktif = o => !('Aktif' in o) || o.Aktif !== 'Hayır';
function turOf(kod){ return T('emir-turleri').find(t => t.Kod === kod) || {}; }
function durumOf(ad){ return T('durumlar').find(d => d['Açıklama'] === ad) || {}; }
function renk(ad){ return RENK[durumOf(ad).Renk] || '#9DA7B3'; }
function pill(ad, label){ const c = renk(ad); return '<span class="pill" style="color:'+c+';background:'+c+'24">'+esc(label || ad || '—')+'</span>'; }

// ---------- Senkron ----------
async function sync(force){
  if (!S.token || S.busy) return;
  S.busy = true; setSync('busy');
  try {
    const [c] = await Promise.all([gh('/commits/' + BRANCH), runnerStatus()]);
    if (!force && c.sha === S.head) { S.last = new Date(); setSync('ok'); return; }
    S.head = c.sha;
    const [tdir, edir, sdir] = await Promise.all([listDir('tanimlar'), listDir('emirler'), listDir('sonuclar')]);
    await Promise.all(TANIM_FILES.map(async ([n]) => {
      const e = tdir.find(x => x.name === n + '.md'); if (!e) return;
      S.tanimRaw[n] = e; S.tanim[n] = parseTanim(await blobText(e.path, e.sha));
    }));
    const of = edir.filter(e => e.type === 'file' && /\.md$/.test(e.name) && !e.name.startsWith('_'));
    S.orders = await Promise.all(of.map(async e => { const o = parseOrder(await blobText(e.path, e.sha)); o.id = o.id || e.name.replace(/\.md$/,''); o.path = e.path; o.sha = e.sha; return o; }));
    S.orders.sort((a,b) => b.id.localeCompare(a.id, 'tr', { numeric: true }));
    S.results = {}; S.ekler = {};
    await Promise.all(sdir.map(async e => {
      if (e.name.startsWith('_')) return;
      if (e.type === 'file' && /\.md$/.test(e.name)) S.results[e.name.replace(/\.md$/,'')] = parseResult(await blobText(e.path, e.sha));
      else if (e.type === 'dir') S.ekler[e.name] = (await listDir(e.path)).filter(x => x.type === 'file');
    }));
    if (S.sel && !S.orders.find(o => o.id === S.sel)) S.sel = null;
    S.err = null; S.last = new Date(); setSync('ok'); render();
  } catch (e) {
    S.err = e.message; setSync('err'); if (force) toast(e.message, true);
    if (e.status === 401) render();
  } finally { S.busy = false; }
}
async function runnerStatus(){
  try {
    const [rn, q] = await Promise.all([
      gh('/actions/runners', { soft: true }),
      gh('/actions/runs?status=queued&per_page=10', { soft: true })
    ]);
    const prev = JSON.stringify([S.runner, S.queued]);
    if (rn.__denied) S.runner = { denied: true };
    else { const r = (rn.runners || []).find(x => x.name === 'TGS') || (rn.runners || [])[0]; S.runner = r ? { online: r.status === 'online', busy: r.busy } : { none: true }; }
    S.queued = q.__denied ? null : (q.total_count || 0);
    paintRunner();
    if (prev !== JSON.stringify([S.runner, S.queued]) && S.head) render();
  } catch (e) { S.runner = { err: true }; paintRunner(); }
}
function paintRunner(){
  const r = S.runner || {}, el = document.getElementById('runner');
  let c = '#6E7681', t = 'Runner: —';
  if (r.denied) t = 'Runner: izin yok';
  else if (r.none) t = 'Runner: kayıtlı değil';
  else if (r.err) t = 'Runner: okunamadı';
  else if (r.online) { c = r.busy ? '#E3B341' : '#3FB950'; t = r.busy ? 'Runner: çalışıyor' : 'Runner: çevrimiçi'; }
  else if ('online' in r) { c = '#F85149'; t = 'Runner: kapalı'; }
  if (S.queued) t += ' · kuyrukta ' + S.queued;
  el.innerHTML = '<span class="dot" style="width:8px;height:8px;background:'+c+'"></span><span'+(c==='#6E7681'?' class="muted"':'')+'>'+esc(t)+'</span>';
  el.title = r.denied ? 'Token’a Administration: Read ve Actions: Read izinleri gerekli' : 'Runner durumu';
}
function setSync(st){
  const d = document.getElementById('syncdot'), t = document.getElementById('synctext');
  d.className = 'spin' + (st === 'busy' ? ' busy' : st === 'err' ? ' err' : '');
  if (st === 'err') t.textContent = 'Hata: ' + S.err;
  else if (st === 'busy') t.textContent = 'Senkronize ediliyor…';
  else t.textContent = 'Canlı · ' + S.last.toLocaleTimeString('tr-TR');
}

// ---------- Görünümler ----------
function render(){
  document.getElementById('nav-emirler').className = S.view === 'emirler' ? 'on' : '';
  document.getElementById('nav-tanimlar').className = S.view === 'tanimlar' ? 'on' : '';
  document.getElementById('chips').innerHTML = T('musteriler').map(m => '<div class="chip'+(aktif(m)?'':' off')+'"><span class="dot" style="width:8px;height:8px;background:'+(aktif(m)?'#3FB950':'#6E7681')+'"></span><b>'+esc(m['Müşteri'])+'</b><span class="muted" style="font-size:12px">'+esc(m['Köprü'])+(m.SID && m.SID!=='—' ? ' · '+esc(m.SID)+'/'+esc(m.Client) : '')+'</span></div>').join('');
  const app = document.getElementById('app');
  if (!S.token) { app.innerHTML = setupHtml(); return; }
  if (!S.head) { app.innerHTML = '<div class="empty" style="flex:1">Yükleniyor…</div>'; return; }
  app.innerHTML = S.view === 'emirler' ? emirlerHtml() : tanimlarHtml();
}

function setupHtml(){
  return '<div class="card" style="max-width:640px;margin:40px auto;display:flex;flex-direction:column;gap:16px">' +
    '<h2 style="font-size:20px">Bağlantı</h2>' +
    '<p class="muted" style="margin:0;line-height:1.6">Panel <code>'+REPO+'</code> reposuna GitHub token ile bağlanır. Token sadece bu tarayıcıda saklanır.</p>' +
    '<label class="f">GitHub token (fine-grained, Contents: Read and write)<input class="in mono" id="tok" type="password" autocomplete="off" placeholder="github_pat_…"></label>' +
    '<div style="display:flex;gap:12px;justify-content:flex-end"><button class="btn" data-a="savetok">Bağlan</button></div></div>';
}

function emirlerHtml(){
  const durs = T('durumlar').filter(aktif);
  const counts = durs.map(d => [d['Açıklama'], S.orders.filter(o => o.f.Durum === d['Açıklama']).length]).filter(x => x[1] > 0);
  let left = '<section class="left"><div style="display:flex;justify-content:space-between;align-items:center"><h2>İş emirleri</h2>' +
    '<button class="btn" data-a="new" style="display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Yeni emir</button></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' + counts.map(([d,n]) => pill(d, d + ' · ' + n)).join('') + '</div><div style="display:flex;flex-direction:column;gap:8px">';
  if (!S.orders.length) left += '<div class="empty">Henüz emir yok</div>';
  S.orders.forEach(o => {
    const on = o.id === S.sel && !S.form;
    left += '<button class="row'+(on?' on':'')+'" data-a="sel" data-id="'+esc(o.id)+'"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="mono muted" style="font-size:13px">'+esc(o.id)+'</span>'+pill(o.f.Durum)+'</div>' +
      '<div style="font-weight:600;font-size:15px">'+esc(o.f['Nesne adı'])+' <span class="muted" style="font-weight:400">· '+esc((turOf(o.f['Emir türü'])['Açıklama']) || o.f['Emir türü'])+'</span></div><div class="t">'+esc(o.f.Talimat)+'</div></button>';
  });
  left += '</div></section>';
  let right = '<section class="right">';
  if (S.form) right += formHtml();
  else { const o = S.orders.find(x => x.id === S.sel) || S.orders[0]; if (o) { S.sel = o.id; right += detailHtml(o); } else right += '<div class="empty">Soldan bir emir seç ya da yeni emir ver</div>'; }
  return left + right + '</section>';
}

function detailHtml(o){
  const f = o.f, tur = turOf(f['Emir türü']), needOnay = tur['Onay gerekli'] === 'Evet';
  const durs = T('durumlar').filter(aktif).sort((a,b) => (+a['Sıra']) - (+b['Sıra']));
  const flow = durs.filter(d => d['Bitiş'] !== 'Evet' && (needOnay || d.Kod !== 'ONAY'));
  const curD = durumOf(f.Durum), final = curD['Bitiş'] === 'Evet';
  const labels = flow.map(d => d['Açıklama']).concat([final ? f.Durum : 'Tamam']);
  const cur = final ? labels.length - 1 : labels.indexOf(f.Durum);
  const steps = labels.map((l,i) => {
    const col = i < cur ? 'var(--accent)' : i === cur ? renk(l) : 'var(--line)';
    return '<div class="step"><span class="sdot" style="background:'+col+(i===cur?';box-shadow:0 0 0 4px '+renk(l)+'30':'')+'"></span><span style="font-size:13px;font-weight:'+(i===cur?600:400)+';color:'+(i<=cur?'var(--text)':'var(--dim)')+'">'+esc(l)+'</span>'+(i<labels.length-1?'<span class="sline" style="background:'+(i<cur?'var(--accent)':'var(--line)')+'"></span>':'')+'</div>';
  }).join('');
  const r = S.results[o.id], ek = S.ekler[o.id] || [];
  let h = '<div class="card" style="display:flex;flex-direction:column;gap:20px">' +
    '<div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:6px"><span class="mono muted" style="font-size:13px">'+esc(o.id)+' · '+esc(f['Müşteri'])+' · '+esc(f['Sistem / Client'])+'</span>' +
    '<h2 style="font-size:22px">'+esc(f['Nesne adı'])+' <span class="muted" style="font-weight:400;font-size:15px">'+esc(f['Nesne tipi'])+'</span></h2></div>'+pill(f.Durum)+'</div>' +
    '<div class="steps">'+steps+'</div>' +
    '<div class="grid4">' + [['Emir türü', tur['Açıklama'] || f['Emir türü']],['Öncelik', (T('oncelikler').find(x => x.Kod === f['Öncelik']) || {})['Açıklama'] || f['Öncelik']],['Request tercihi', f['Request tercihi']],['Son tarih', f['Son tarih']]].map(kv).join('') +
    '<div class="kv" style="grid-column:span 2"><span>Talimat</span><span>'+esc(f.Talimat)+'</span></div>' + kv(['Beklenen çıktı', f['Beklenen çıktı']]) +
    '<div class="kv"><span>Alındı / Bitti</span><span class="mono">'+esc(f['Alındı']||'—')+' / '+esc(f.Bitti||'—')+'</span></div></div>';
  if (f.Durum === 'Onay bekliyor' || (o.plan.length && needOnay)) {
    h += '<div class="plan"><b style="color:#F0A86E">Ajanın planı'+(f.Onay ? '' : ' · onayını bekliyor')+'</b>' +
      (o.plan.length ? '<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">'+o.plan.map(p => '<li>'+inline(p)+'</li>').join('')+'</ol>' : '<span class="muted">Plan henüz yazılmadı.</span>');
    if (f.Durum === 'Onay bekliyor' && !f.Onay) h += '<div style="display:flex;gap:12px"><button class="btn ok" data-a="onay" data-v="Evet">Onayla</button><button class="btn no" data-a="onay" data-v="Hayır">Reddet</button></div>';
    else if (f.Onay) h += '<div class="mono" style="font-size:13px">Onay: '+esc(f.Onay)+(f.Durum === 'Onay bekliyor' ? ' · ajan otomatik devam edecek' : '')+'</div>';
    h += '</div>';
  }
  if (r) {
    h += '<div class="log mono"><div><span class="k">İstenen</span>'+inline(r.istenen||'')+'</div>' +
      '<div style="display:flex"><span class="k" style="flex:none">Yapılan</span><div style="display:flex;flex-direction:column">'+r.yapilan.map(y => '<span>– '+inline(y)+'</span>').join('')+'</div></div>' +
      '<div><span class="k">Sonuç</span><span style="font-weight:500;color:'+(f.Durum === 'Hata' ? '#FF7B72' : '#56D364')+'">'+inline(r.sonuc||'')+'</span></div>' +
      (r.sonraki ? '<div><span class="k">Sonraki</span>'+inline(r.sonraki)+'</div>' : '') + '</div>';
  } else if (f.Durum === 'Verildi') {
    const r = S.runner || {};
    if ('online' in r && !r.online) h += '<div class="note" style="background:rgba(248,81,73,.12);color:#FF7B72">Runner kapalı. Emir kuyrukta bekliyor; TGS’de runner açılınca otomatik işlenecek (24 saat içinde).</div>';
    else h += '<div class="muted" style="font-size:13px">Runner emri birazdan alacak.</div>';
  }
  if (ek.length) h += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="muted" style="font-size:12px">Ekler</span>' + ek.map(e => '<span class="ek mono">'+esc(e.name)+' <button data-a="ek" data-p="'+esc(e.path)+'" data-s="'+esc(e.sha)+'">Görüntüle</button><a href="'+esc(e.html_url)+'" target="_blank" rel="noopener">GitHub</a></span>').join('') + '</div>';
  return h + '</div>';
}
function kv(a){ return '<div class="kv"><span>'+esc(a[0])+'</span><span>'+esc(a[1] || '—')+'</span></div>'; }

function formHtml(){
  const d = S.draft;
  const mus = T('musteriler').filter(aktif), tip = T('nesne-tipleri').filter(aktif), tur = T('emir-turleri').filter(aktif), onc = T('oncelikler').filter(aktif).sort((a,b)=>(+a['Sıra'])-(+b['Sıra']));
  const curTur = turOf(d.tur || (tur[0]||{}).Kod), yaz = curTur['Yazma izni'] === 'Evet';
  const req = T('request-tercihleri').filter(aktif).filter(r => !r['Geçerli türler'] || r['Geçerli türler'].split(',').map(s=>s.trim()).includes(curTur.Kod));
  const opt = (arr, val, lab, cur) => arr.map(x => '<option value="'+esc(val(x))+'"'+(cur===val(x)?' selected':'')+'>'+esc(lab(x))+'</option>').join('');
  return '<div class="card" style="display:flex;flex-direction:column;gap:16px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:18px">Yeni iş emri</h2><span class="muted" style="font-size:12px">Emir no otomatik verilir</span></div>' +
    '<div class="grid2">' +
    '<label class="f">Müşteri / Sistem<select class="in" data-d="mus">'+opt(mus, m=>m['Müşteri'], m=>m['Müşteri']+' · '+m.SID+' / '+m.Client, d.mus)+'</select></label>' +
    '<label class="f">Nesne tipi<select class="in" data-d="tip">'+opt(tip, t=>t.Kod, t=>t['Açıklama'], d.tip)+'</select></label>' +
    '<label class="f">Nesne adı<input class="in mono" data-d="nesne" value="'+esc(d.nesne||'')+'" placeholder="ZOA_DENEME" style="text-transform:uppercase"></label>' +
    '<label class="f">Emir türü<select class="in" data-d="tur" data-rerender="1">'+opt(tur, t=>t.Kod, t=>t['Açıklama'], d.tur)+'</select></label>' +
    '</div><label class="f">Talimat<textarea class="in" rows="3" data-d="talimat" placeholder="Ne yapılmasını istiyorsun?">'+esc(d.talimat||'')+'</textarea></label>' +
    '<div class="grid2"><label class="f">Beklenen çıktı<input class="in" data-d="cikti" value="'+esc(d.cikti||'')+'" placeholder="Örn. paket adı + kaynak kod"></label>' +
    '<label class="f">Öncelik<select class="in" data-d="onc">'+opt(onc, o=>o.Kod, o=>o['Açıklama'], d.onc || (onc.find(o=>o.Kod==='NORMAL')||{}).Kod)+'</select></label>' +
    '<label class="f">Son tarih (isteğe bağlı)<input class="in" type="datetime-local" data-d="son" value="'+esc(d.son||'')+'"></label>' +
    (yaz ? '<label class="f">Request tercihi<select class="in" data-d="req">'+opt(req, r=>r['Açıklama'], r=>r['Açıklama'], d.req)+'</select></label>' : '<div></div>') + '</div>' +
    (curTur['Onay gerekli'] === 'Evet' ? '<div class="note">Bu tür onay gerektirir: ajan önce plan sunar, onayın olmadan sistemde değişiklik yapmaz.</div>' : '') +
    '<div style="display:flex;gap:12px;justify-content:flex-end"><button class="btn ghost" data-a="cancel">Vazgeç</button><button class="btn" data-a="submit" id="submitbtn">Emri ver</button></div></div>';
}

function tanimlarHtml(){
  const cur = TANIM_FILES.find(x => x[0] === S.tab), t = S.tanim[S.tab] || { head: [], data: [] };
  let h = '<nav class="tabs" aria-label="Listeler">' + TANIM_FILES.map(([n,l]) => '<button class="'+(n===S.tab?'on':'')+'" data-a="tab" data-v="'+n+'"><span>'+esc(l)+'</span><span class="mono muted" style="font-size:12px">'+((S.tanim[n]||{data:[]}).data.length)+'</span></button>').join('') + '</nav>';
  const cols = t.head.filter(c => c !== 'Aktif'), hasA = t.head.includes('Aktif');
  h += '<section class="right card" style="gap:16px"><div><h2 style="font-size:18px">'+esc(cur[1])+'</h2><span class="muted" style="font-size:13px">'+esc(cur[2])+' Değerler silinmez, pasife alınır.</span></div>' +
    '<div style="overflow-x:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr>' + cols.map(c => '<th scope="col">'+esc(c)+'</th>').join('') + (hasA?'<th scope="col">Aktif</th>':'') + '<th scope="col"><span class="muted" style="font-weight:400">İşlem</span></th></tr></thead><tbody>';
  t.data.forEach((o,i) => {
    const ed = S.editRow === i;
    h += '<tr class="'+(aktif(o)?'':'pas')+'">' + cols.map((c,j) => '<td'+(j===0?' class="mono"':'')+'>'+(ed && j>0 ? '<input class="in" style="min-height:36px;padding:6px 8px" data-e="'+esc(c)+'" value="'+esc(o[c])+'">' : esc(o[c]))+'</td>').join('') +
      (hasA ? '<td><button class="tog '+(aktif(o)?'a':'p')+'" data-a="tog" data-i="'+i+'">'+(aktif(o)?'Aktif':'Pasif')+'</button></td>' : '') +
      '<td>'+(ed ? '<button class="btn" style="min-height:34px;padding:0 12px" data-a="saverow" data-i="'+i+'">Kaydet</button> <button class="btn ghost" style="min-height:34px;padding:0 12px" data-a="editrow" data-i="-1">Vazgeç</button>' : '<button class="btn ghost" style="min-height:34px;padding:0 12px" data-a="editrow" data-i="'+i+'">Düzenle</button>')+'</td></tr>';
  });
  h += '</tbody></table></div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">' + cols.map((c,j) => '<label class="f" style="flex:1 1 '+(j===0?'140px':'120px')+'">'+esc(c)+'<input class="in'+(j===0?' mono':'')+'" data-n="'+esc(c)+'"></label>').join('') +
    '<button class="btn" data-a="addrow">Değer ekle</button></div></section>';
  return h;
}

// ---------- Aksiyonlar ----------
async function writeTanim(msg){
  const n = S.tab, raw = S.tanimRaw[n];
  await putFile('tanimlar/' + n + '.md', tanimMd(S.tanim[n]), 'Tanım: ' + n + ' – ' + msg, raw && raw.sha);
  toast('Kaydedildi'); S.editRow = -1; await sync(true);
}
async function submitOrder(){
  const d = S.draft, btn = document.getElementById('submitbtn');
  const mus = T('musteriler').find(m => m['Müşteri'] === d.mus), tip = T('nesne-tipleri').find(t => t.Kod === d.tip), tur = turOf(d.tur);
  if (!mus || !tip || !tur.Kod) return toast('Müşteri, nesne tipi ve emir türü seçilmeli', true);
  if (!(d.nesne||'').trim() || !(d.talimat||'').trim()) return toast('Nesne adı ve talimat zorunlu', true);
  btn.disabled = true;
  try {
    await sync(true);
    const pre = mus['Müşteri'] + '-';
    const max = S.orders.filter(o => o.id.startsWith(pre)).reduce((m,o) => Math.max(m, parseInt(o.id.slice(pre.length),10) || 0), 0);
    const id = pre + String(max + 1).padStart(4,'0');
    const f = { 'Müşteri': mus['Müşteri'], 'Sistem / Client': mus.SID + ' / ' + mus.Client, 'Nesne tipi': tip.Kod + ' (' + tip['Açıklama'] + ')', 'Nesne adı': d.nesne.trim().toUpperCase(),
      'Emir türü': tur.Kod, 'Talimat': d.talimat.trim(), 'Beklenen çıktı': (d.cikti||'').trim(), 'Request tercihi': tur['Yazma izni'] === 'Evet' ? (d.req || (document.querySelector('[data-d=req]') || {}).value || '') : '',
      'Öncelik': d.onc || 'NORMAL', 'Son tarih': d.son ? d.son.replace('T',' ') : '' };
    await putFile('emirler/' + id + '.md', orderMd(id, f), id + ': Verildi');
    toast(id + ' gönderildi'); S.form = false; S.draft = {}; S.sel = id; await sync(true);
  } catch (e) { toast(e.message, true); btn.disabled = false; }
}
async function setOnay(v){
  const o = S.orders.find(x => x.id === S.sel); if (!o) return;
  try {
    const md = await blobText(o.path, o.sha);
    const nmd = md.replace(/^\|\s*Onay\s*\|.*\|\s*$/m, '| Onay | ' + v + ' |');
    await putFile(o.path, nmd, o.id + ': Onay ' + v, o.sha);
    toast(o.id + ': Onay ' + v); await sync(true);
  } catch (e) { toast(e.message, true); }
}
async function showEk(p, sha){
  try {
    const t = await blobText(p, sha);
    document.getElementById('modal').innerHTML = '<div class="modal" data-a="close"><div class="card" role="dialog" aria-label="'+esc(p)+'"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><b class="mono" style="font-size:13px">'+esc(p)+'</b><div style="display:flex;gap:8px"><button class="btn ghost" data-a="copy">Kopyala</button><button class="btn ghost" data-a="close">Kapat</button></div></div><pre class="mono" id="ektext">'+esc(t)+'</pre></div></div>';
  } catch (e) { toast(e.message, true); }
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'close') { if (ev.target === el || el.tagName === 'BUTTON') document.getElementById('modal').innerHTML = ''; return; }
  if (a === 'copy') { try { await navigator.clipboard.writeText(document.getElementById('ektext').textContent); toast('Kopyalandı'); } catch(e){ toast('Kopyalanamadı', true); } return; }
  if (a === 'view') { S.view = el.dataset.v; S.editRow = -1; render(); }
  else if (a === 'refresh') sync(true);
  else if (a === 'settings') { if (S.token && !window.__confirmTok) { window.__confirmTok = 1; toast('Token’ı silmek için tekrar tıkla'); setTimeout(()=>window.__confirmTok=0, 4000); return; } save('ailife_token', null); S.token=''; S.head=null; render(); }
  else if (a === 'savetok') { const v = document.getElementById('tok').value.trim(); if (!v) return; S.token = v; save('ailife_token', v); render(); await sync(true); }
  else if (a === 'sel') { S.sel = el.dataset.id; S.form = false; render(); }
  else if (a === 'new') { const tur = T('emir-turleri').filter(aktif); S.draft = { mus: (T('musteriler').filter(aktif)[0]||{})['Müşteri'], tip: (T('nesne-tipleri').filter(aktif)[0]||{}).Kod, tur: (tur[0]||{}).Kod }; S.form = true; render(); }
  else if (a === 'cancel') { S.form = false; render(); }
  else if (a === 'submit') submitOrder();
  else if (a === 'onay') { el.disabled = true; setOnay(el.dataset.v); }
  else if (a === 'ek') showEk(el.dataset.p, el.dataset.s);
  else if (a === 'tab') { S.tab = el.dataset.v; S.editRow = -1; render(); }
  else if (a === 'tog') { const o = S.tanim[S.tab].data[+el.dataset.i]; o.Aktif = aktif(o) ? 'Hayır' : 'Evet'; el.disabled = true; try { await writeTanim((o.Kod||o['Müşteri']) + ' ' + (o.Aktif==='Evet'?'aktif':'pasif')); } catch(e){ toast(e.message,true); await sync(true); } }
  else if (a === 'editrow') { S.editRow = +el.dataset.i; render(); }
  else if (a === 'saverow') { const o = S.tanim[S.tab].data[+el.dataset.i]; document.querySelectorAll('[data-e]').forEach(i => o[i.dataset.e] = i.value.trim()); try { await writeTanim('satır güncellendi'); } catch(e){ toast(e.message,true); await sync(true); } }
  else if (a === 'addrow') {
    const t = S.tanim[S.tab], o = {}; let ok = true;
    document.querySelectorAll('[data-n]').forEach((i,j) => { o[i.dataset.n] = i.value.trim() || '—'; if (j===0 && !i.value.trim()) ok = false; });
    if (!ok) return toast('İlk alan zorunlu', true);
    if (t.head.includes('Aktif')) o.Aktif = 'Evet';
    t.data.push(o); try { await writeTanim('değer eklendi'); } catch(e){ toast(e.message,true); await sync(true); }
  }
});
document.addEventListener('input', ev => { const k = ev.target.dataset && ev.target.dataset.d; if (k) S.draft[k] = ev.target.value; });
document.addEventListener('change', ev => { const t = ev.target; if (t.dataset && t.dataset.d) { S.draft[t.dataset.d] = t.value; if (t.dataset.rerender) render(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') document.getElementById('modal').innerHTML = ''; if (ev.key === 'Enter' && ev.target.id === 'tok') document.querySelector('[data-a=savetok]').click(); });

render();
if (S.token) sync(true);
setInterval(() => { if (!document.hidden) sync(false); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(false); });
</script>
</body>
</html>
